<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보안 대시보드 — 로그인 경보</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">
  {% include 'partials/_nav.html' %}

  <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full">
    <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3 mb-6">
      <div>
        <h1 class="text-2xl font-bold">🛡️ 보안 대시보드</h1>
        <p class="text-sm text-gray-500 mt-1">n8n이 판정해 보낸 허용·거부 기록</p>
      </div>
      <div class="flex gap-2 items-center">
        <label for="student-filter" class="sr-only">학생 선택</label>
        <select id="student-filter" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="">전체 학생</option>
        </select>
        <button id="refresh-btn" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700">새로고침</button>
      </div>
    </div>

    <div id="load-error" role="alert" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-xl p-4 mb-6"></div>

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
      <div class="bg-white rounded-xl shadow-sm p-4"><div class="text-xs text-gray-500">전체</div><div id="stat-total" class="text-2xl font-bold mt-1">-</div></div>
      <div class="bg-white rounded-xl shadow-sm p-4 border-l-4 border-red-500"><div class="text-xs text-gray-500">거부</div><div id="stat-deny" class="text-2xl font-bold mt-1 text-red-600">-</div></div>
      <div class="bg-white rounded-xl shadow-sm p-4 border-l-4 border-emerald-500"><div class="text-xs text-gray-500">허용</div><div id="stat-allow" class="text-2xl font-bold mt-1 text-emerald-600">-</div></div>
      <div class="bg-white rounded-xl shadow-sm p-4"><div class="text-xs text-gray-500">최다 거부 IP</div><div id="stat-top-ip" class="text-lg font-bold mt-1 truncate">-</div></div>
    </div>

    <section class="bg-white rounded-xl shadow-sm p-4 mb-6">
      <h2 class="font-semibold mb-3">거부 상위 IP</h2>
      <div id="top-ips" class="space-y-2 text-sm text-gray-500">불러오는 중…</div>
    </section>

    <section class="bg-white rounded-xl shadow-sm overflow-hidden">
      <div class="p-4 flex items-center justify-between gap-3">
        <h2 class="font-semibold">최근 이벤트</h2>
        <div class="flex gap-1 text-xs" aria-label="판정 필터">
          <button data-decision="" class="filter-btn px-2 py-1 rounded bg-indigo-600 text-white">전체</button>
          <button data-decision="deny" class="filter-btn px-2 py-1 rounded bg-gray-100 hover:bg-gray-200">거부</button>
          <button data-decision="allow" class="filter-btn px-2 py-1 rounded bg-gray-100 hover:bg-gray-200">허용</button>
        </div>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm whitespace-nowrap">
          <thead class="bg-gray-50 text-gray-600"><tr>
            <th class="text-left px-4 py-2 font-medium">#</th><th class="text-left px-4 py-2 font-medium">학생</th>
            <th class="text-left px-4 py-2 font-medium">출발지 IP</th><th class="text-left px-4 py-2 font-medium">판정</th>
            <th class="text-left px-4 py-2 font-medium">심각도</th><th class="text-left px-4 py-2 font-medium">횟수</th>
            <th class="text-left px-4 py-2 font-medium">사유</th><th class="text-left px-4 py-2 font-medium">저장 시각</th>
          </tr></thead>
          <tbody id="event-rows" class="divide-y divide-gray-100">
            <tr><td colspan="8" class="px-4 py-6 text-center text-gray-400">불러오는 중…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    let currentDecision = '';
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g,
      char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const badge = (decision) => decision === 'deny'
      ? '<span class="px-2 py-0.5 rounded-full bg-red-100 text-red-700 text-xs font-medium">🚫 거부</span>'
      : '<span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 text-xs font-medium">✅ 허용</span>';
    const severityClass = (value) => ({High:'text-red-600', Medium:'text-amber-600'}[value] || 'text-gray-500');

    function studentQuery() {
      const value = document.getElementById('student-filter').value;
      return value ? `student=${encodeURIComponent(value)}` : '';
    }
    async function readJson(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`${url} 요청 실패 (${response.status})`);
      return response.json();
    }
    function showError(error) {
      const box = document.getElementById('load-error');
      box.textContent = error.message || String(error);
      box.classList.remove('hidden');
    }
    function clearError() { document.getElementById('load-error').classList.add('hidden'); }

    async function loadStudents() {
      const data = await readJson('/api/security/students');
      const select = document.getElementById('student-filter');
      const selected = select.value;
      select.innerHTML = '<option value="">전체 학생</option>' +
        (data.students || []).map(name => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join('');
      select.value = selected;
    }
    async function loadSummary() {
      const query = studentQuery();
      const data = await readJson('/api/security/events/summary' + (query ? '?' + query : ''));
      const deny = data.by_decision?.deny || 0;
      const allow = data.by_decision?.allow || 0;
      document.getElementById('stat-deny').textContent = deny;
      document.getElementById('stat-allow').textContent = allow;
      document.getElementById('stat-total').textContent = deny + allow;
      const top = data.top_deny_ips || [];
      document.getElementById('stat-top-ip').textContent = top.length ? top[0].src_ip : '-';
      const maximum = top.length ? Math.max(top[0].fails, 1) : 1;
      document.getElementById('top-ips').innerHTML = top.length
        ? top.map(item => `<div class="flex items-center gap-3">
            <span class="font-mono text-gray-800 w-36 shrink-0">${escapeHtml(item.src_ip)}</span>
            <div class="flex-1 bg-gray-100 rounded-full h-2 overflow-hidden"><div class="bg-red-500 h-2" style="width:${Math.min(100, item.fails / maximum * 100)}%"></div></div>
            <span class="text-gray-600 w-16 text-right">${item.fails}회</span></div>`).join('')
        : '<div class="text-gray-400">거부 기록이 없습니다.</div>';
    }
    async function loadEvents() {
      const query = [studentQuery(), currentDecision ? `decision=${currentDecision}` : '', 'limit=50'].filter(Boolean).join('&');
      const data = await readJson('/api/security/events?' + query);
      const rows = document.getElementById('event-rows');
      if (!data.events?.length) {
        rows.innerHTML = '<tr><td colspan="8" class="px-4 py-6 text-center text-gray-400">기록이 없습니다.</td></tr>';
        return;
      }
      rows.innerHTML = data.events.map(event => `<tr class="hover:bg-gray-50">
        <td class="px-4 py-2 text-gray-400">${event.id}</td><td class="px-4 py-2 font-medium">${escapeHtml(event.student)}</td>
        <td class="px-4 py-2 font-mono">${escapeHtml(event.src_ip)}</td><td class="px-4 py-2">${badge(event.decision)}</td>
        <td class="px-4 py-2 font-medium ${severityClass(event.severity)}">${escapeHtml(event.severity)}</td><td class="px-4 py-2">${event.fail_count}</td>
        <td class="px-4 py-2 text-gray-600 max-w-xs truncate" title="${escapeHtml(event.reason)}">${escapeHtml(event.reason)}</td>
        <td class="px-4 py-2 text-gray-400">${escapeHtml((event.created_at || '').replace('T',' ').slice(0,19))}</td></tr>`).join('');
    }
    async function reload({students = false} = {}) {
      clearError();
      try {
        if (students) await loadStudents();
        await Promise.all([loadSummary(), loadEvents()]);
      } catch (error) { showError(error); }
    }
    document.getElementById('refresh-btn').addEventListener('click', () => reload({students:true}));
    document.getElementById('student-filter').addEventListener('change', () => reload());
    document.querySelectorAll('.filter-btn').forEach(button => button.addEventListener('click', () => {
      currentDecision = button.dataset.decision;
      document.querySelectorAll('.filter-btn').forEach(item => {
        item.className = 'filter-btn px-2 py-1 rounded ' + (item === button ? 'bg-indigo-600 text-white' : 'bg-gray-100 hover:bg-gray-200');
      });
      reload();
    }));
    reload({students:true});
  </script>
</body>
</html>
